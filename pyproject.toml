[project]
name = "ai-excel-analyst"
version = "0.1.0"
description = "Upload a CSV or Excel file and ask questions about it in plain English."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "duckdb>=1.1",
    "agno>=1.7",
    "groq>=0.30",
]

[tool.uv]
package = false   # this is an application, not an installable library
